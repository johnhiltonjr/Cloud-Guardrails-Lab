name: guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main deployments without interrupting an apply.
concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_DIR: modules/01-guardrails-as-code/terraform
  POLICY_DIR: modules/01-guardrails-as-code/policy
  TF_VERSION: "1.17.1"
  CONFTEST_IMAGE: openpolicyagent/conftest:v0.71.1
  TF_IN_AUTOMATION: "true"

# TODO Module 3: pin actions and container images to immutable SHAs/digests.
jobs:
  static-scan:
    name: Static checks and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate without backend access
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkov
        run: |
          python -m pip install --quiet checkov==3.4.11
          checkov -d "$TF_DIR" --framework terraform --compact

      - name: Rego unit tests
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "$CONFTEST_IMAGE" \
            verify --policy "$POLICY_DIR" --rego-version v1

  plan-policy:
    name: Plan and evaluate policy
    needs: static-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Azure configuration
        run: |
          : "${ARM_CLIENT_ID:?Missing AZURE_PLAN_CLIENT_ID}"
          : "${ARM_TENANT_ID:?Missing AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?Missing AZURE_SUBSCRIPTION_ID}"

      - name: Azure login with planning identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="use_cli=false" \
            -backend-config="use_oidc=true"

          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -json tfplan > plan.json
          terraform show -no-color tfplan > plan.txt

      - name: Evaluate saved plan with Conftest
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "$CONFTEST_IMAGE" \
            test "$TF_DIR/plan.json" \
            --policy "$POLICY_DIR" \
            --rego-version v1

      - name: Record plan provenance
        working-directory: ${{ env.TF_DIR }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > revision.txt
          sha256sum tfplan .terraform.lock.hcl > plan.sha256

      - name: Upload checked plan
        uses: actions/upload-artifact@v4
        with:
          name: checked-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/plan.txt
            ${{ env.TF_DIR }}/revision.txt
            ${{ env.TF_DIR }}/plan.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy approved plan
    needs: plan-policy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lab

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Azure configuration
        run: |
          : "${ARM_CLIENT_ID:?Missing AZURE_DEPLOY_CLIENT_ID}"
          : "${ARM_TENANT_ID:?Missing AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?Missing AZURE_SUBSCRIPTION_ID}"

      - name: Download checked plan from this run
        uses: actions/download-artifact@v4
        with:
          name: checked-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_DIR }}

      - name: Verify revision and file checksums
        working-directory: ${{ env.TF_DIR }}
        run: |
          test "$(cat revision.txt)" = "$GITHUB_SHA"
          sha256sum --check plan.sha256

      - name: Azure login with deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply the checked saved plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="use_cli=false" \
            -backend-config="use_oidc=true"

          terraform apply -input=false -lock-timeout=5m tfplan

      - name: Show deployment identifiers
        working-directory: ${{ env.TF_DIR }}
        run: terraform output